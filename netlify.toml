[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Mavjud fayllar (kirish.html) to'g'ridan-to'g'ri ochilsin
[[redirects]]
  from = "/kirish.html"
  to = "/kirish.html"
  status = 200
  force = false

# React Router uchun - faqat boshqa yo'nalishlar index.html ga
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
