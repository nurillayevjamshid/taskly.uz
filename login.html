<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly - Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2);
        }
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }
        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link a:hover {
            color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x="9" y="9" x2="15" y2="9"></line>
                    <line x="9" y="15" x2="15" y2="15"></line>
                </svg>
            </div>
            <div class="logo-text">Taskly</div>
        </div>
        
        <h2 style="text-align: center; color: #1f2937; margin-bottom: 2rem; font-size: 18px; font-weight: 600;">Hisobni almashtirish</h2>
        <p style="text-align: center; color: #6b7280; margin-bottom: 2rem; font-size: 14px; line-height: 1.5;">
            Iltimos, hisobingizni almashtirish uchun quyidagi ma'lumotlarni kiriting.
        </p>
        
        <form id="switchAccountForm">
            <div class="form-group">
                <label class="form-label" for="email">Email manzil</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    placeholder="email@example.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Parol</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="********"
                    required
                >
            </div>
            
            <button type="submit" class="login-btn">
                Hisobni almashtirish
            </button>
        </form>
        
        <div class="back-link">
            <a href="https://tasklyuz.netlify.app">Asosiy ilovaga qaytish</a>
        </div>
    </div>
    
    <script>
        document.getElementById('switchAccountForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Bu yerga Firebase authentication logikasini qo'shingiz mumkin
            // Hozircha oddiy validatsiya
            if (email && password) {
                alert('Hisob almashtirish funksiyasi hozircha ishlab chiqilmoqda.\n\nTez orada bu funksiya to\'liq ishlaydi!');
                
                // Asosiy ilovaga qaytish
                setTimeout(() => {
                    window.location.href = 'https://tasklyuz.netlify.app';
                }, 2000);
            } else {
                alert('Iltimos, barcha maydonlarni to\'ldiring!');
            }
        });
    </script>
</body>
</html>
